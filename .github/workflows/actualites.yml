name: Actualités
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/import_actualites.py --max 4
        env:
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
      - run: |
          git config user.name "actualites-bot"
          git config user.email "actions@users.noreply.github.com"
          git add actualites.json images/news images/bibliotheque
          git diff --cached --quiet || git commit -m "Actualités du jour"
          git push

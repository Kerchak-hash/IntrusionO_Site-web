/* Bande d'actualités */
.ticker{position:relative;height:46px;background:var(--surface);border-bottom:1px solid var(--line);overflow:hidden;display:flex;align-items:center}
.ticker-label{position:absolute;left:0;top:0;bottom:0;z-index:2;display:flex;align-items:center;padding:0 18px 0 20px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.ticker-mask{width:100%;overflow:hidden;padding-left:150px}
.ticker-track{display:flex;width:max-content}
.ticker-group{display:flex;gap:56px;padding-right:56px;white-space:nowrap;align-items:center}
.ticker-item{display:inline-flex;align-items:center;gap:10px;font-size:.92rem}
.ticker-item .th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:600}
.ticker-item a{color:var(--ink);text-decoration:none}
.ticker-item a:hover{text-decoration:underline}
.ticker-item.promo{background:color-mix(in srgb,var(--signal) 24%,transparent);padding:4px 12px;border-radius:999px}
/* Actualités */
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.news-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px;transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.news-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px -18px color-mix(in srgb,var(--accent) 50%,transparent)}
.news-card h3{font-size:1.08rem;margin:0}
.news-card.promo{border-style:dashed;background:color-mix(in srgb,var(--signal) 8%,var(--surface))}
.news-card a{color:var(--accent);font-weight:500;text-decoration:none;margin-top:auto}
.chip{display:inline-block;font-size:.72rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--accent);align-self:flex-start;text-transform:uppercase;letter-spacing:.05em}
.news-meta{font-size:.82rem;color:var(--ink-soft);margin:0}
/* Encadré produit LAN Share */
.frame{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 1px 0 var(--line)}
.relais-head{display:flex;gap:18px;align-items:center;margin-bottom:18px}
.relais-head img{width:72px;height:72px;border-radius:18px}
.relais-head h2{margin:0 0 2px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:22px 0 20px;flex-wrap:wrap}
.tabs button{border:0;background:none;color:var(--ink-soft);font:inherit;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .25s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabpanel[hidden]{display:none}
.feat{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0;list-style:none;margin:0 0 16px}
.feat li{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--paper)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.shot{position:relative;margin:0;border:1px dashed var(--line);border-radius:12px;aspect-ratio:16/10;display:grid;place-items:center;overflow:hidden;background:var(--paper)}
.shot span{color:var(--ink-soft);font-size:.9rem;position:absolute}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dl{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.dl .soon{opacity:.55;cursor:default}

/* Scène d'actualités */
.stage-news{position:relative;overflow:hidden;padding:72px 0 40px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 12%,var(--paper)),var(--paper) 62%);border-bottom:1px solid var(--line)}
.stage-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(64px);opacity:.42}
.b1{width:440px;height:440px;background:var(--accent);top:-140px;left:-90px}
.b2{width:380px;height:380px;background:var(--signal);top:35%;right:-110px}
.b3{width:300px;height:300px;background:var(--accent);bottom:-140px;left:42%;opacity:.22}
.grid-lines{position:absolute;inset:-48px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;opacity:.6;-webkit-mask-image:radial-gradient(ellipse at center,#000 25%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 25%,transparent 75%)}
.stage-inner{position:relative}
.stage-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.stage-head h2{margin:0}
.live{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:6px 12px;font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.live i{width:8px;height:8px;border-radius:50%;background:#fff;display:inline-block}
.slides{position:relative;min-height:300px}
.slide{display:none;grid-template-columns:minmax(180px,280px) 1fr;gap:40px;align-items:center;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:0 30px 60px -40px color-mix(in srgb,var(--accent) 60%,transparent)}
.slide.active{display:grid;animation:fadeUp .7s var(--ease)}
.slide.promo{border-style:dashed}
.slide h3{font-size:clamp(1.4rem,3vw,2.1rem);line-height:1.2;margin:10px 0}
.ill{width:100%;max-width:280px;aspect-ratio:1;display:grid;place-items:center}
.ill svg{width:100%;height:100%}
.slide-link{display:inline-block;margin-top:12px;color:var(--accent);font-weight:600;text-decoration:none}
.slide-controls{display:flex;align-items:center;gap:18px;margin-top:22px}
.dots{display:flex;gap:8px}
.dot-btn{width:10px;height:10px;border-radius:50%;border:0;background:var(--line);cursor:pointer;padding:0;transition:transform .3s,background .3s}
.dot-btn.on{background:var(--accent);transform:scale(1.4)}
.bar{flex:1;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.bar i.run{animation:prog 7s linear forwards}
.stage-news .ticker-mask{padding-left:0;margin-top:26px;border-top:1px solid var(--line);padding-top:14px;overflow:hidden}
.stage-news .ticker-group{gap:48px;padding-right:48px}
/* Situation LAN Share */
.scenario{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:20px 22px;margin-bottom:16px}
.scenario p{max-width:none}
.sc-title{font-family:Newsreader,Georgia,serif;font-size:1.25rem;font-weight:600}
.sc-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
.sc-box{border:1px solid var(--line);border-radius:12px;padding:18px}
.sc-box.yes{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.sc-box h3{font-size:1.05rem;margin:0 0 6px}
.sc-box p{margin:0;color:var(--ink-soft);font-size:.95rem}
@media (max-width:860px){.slide{grid-template-columns:1fr;gap:20px;text-align:left}.ill{max-width:180px;margin:0 auto}.sc-cols{grid-template-columns:1fr}}

/* Bande d'actualités v2 */
.stage-news{position:relative;overflow:hidden;padding:48px 0;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 14%,var(--paper)),var(--paper) 55%,color-mix(in srgb,var(--signal) 16%,var(--paper)));border-bottom:1px solid var(--line)}
.stage-news .stage-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.stage-news .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.38}
.stage-news .b1{width:420px;height:420px;background:var(--accent);top:-180px;left:-120px}
.stage-news .b2{width:360px;height:360px;background:var(--signal);bottom:-170px;right:-80px}
.stage-news .b3{width:260px;height:260px;background:var(--accent);top:10%;left:44%;opacity:.2}
.news-viewport{position:relative;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.news-track{display:flex;width:max-content}
.news-group{display:flex;gap:22px;padding-right:22px}
.nc{position:relative;width:300px;height:190px;flex:none;border-radius:18px;overflow:hidden;display:block;color:#fff;text-decoration:none;box-shadow:0 18px 36px -22px rgba(31,27,23,.55);transition:transform .4s var(--ease)}
.nc:hover{transform:translateY(-6px) scale(1.02)}
.nc .art{position:absolute;inset:0}
.nc .art svg,.nc .art img{width:100%;height:100%;display:block;object-fit:cover}
.nc .cap{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 14px;background:linear-gradient(transparent,rgba(20,14,10,.82))}
.nc .cap b{display:block;font-family:Newsreader,Georgia,serif;font-size:1.05rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc .cap small{font-size:.7rem;opacity:.8;letter-spacing:.05em;text-transform:uppercase}
.nc.promo{box-shadow:0 0 0 2px var(--signal) inset,0 18px 36px -22px rgba(31,27,23,.55)}
.stage-news:hover .news-track{animation-play-state:paused}
/* Palette LAN Share */
.palette{border:1px solid var(--line);border-radius:16px;background:var(--surface);margin:0 0 20px;overflow:hidden;max-width:820px;transition:box-shadow .3s}
.palette[open]{box-shadow:0 20px 40px -28px color-mix(in srgb,var(--accent) 50%,transparent)}
.palette summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 18px}
.palette summary::-webkit-details-marker{display:none}
.palette summary img{border-radius:12px;flex:none}
.palette .pt{display:flex;flex-direction:column;flex:1}
.palette .pt b{font-family:Newsreader,Georgia,serif;font-size:1.15rem}
.palette .pt span{font-size:.85rem;color:var(--ink-soft)}
.palette .chev{width:10px;height:10px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg);transition:transform .3s var(--ease);margin-right:6px}
.palette[open] .chev{transform:rotate(-135deg)}
.palette-body{padding:0 18px 18px;display:grid;gap:14px}
.palette-body p{margin:0;color:var(--ink-soft);max-width:none}
.pal-shots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pal-shots img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.pal-shots img[style*="none"]{display:none}
.pal-dl{display:flex;flex-wrap:wrap;gap:10px}
@media (max-width:520px){.pal-shots{grid-template-columns:1fr}}

/* Carte LAN Share */
.lan-card{padding:18px;align-self:start}
.lan-head{width:100%;display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.lan-head img{width:56px;height:56px;border-radius:14px;flex:none}
.lan-txt{display:flex;flex-direction:column;flex:1}
.lan-txt b{font-family:Newsreader,Georgia,serif;font-size:1.25rem;font-weight:600}
.lan-txt span{font-size:.9rem;color:var(--ink-soft)}
.lan-head .chev{width:10px;height:10px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg);transition:transform .3s var(--ease);margin-right:6px}
.lan-head[aria-expanded="true"] .chev{transform:rotate(-135deg)}
.lan-body{margin-top:16px;display:grid;gap:14px;animation:fadeUp .4s var(--ease)}
.lan-body[hidden]{display:none}
.lan-body p{margin:0;color:var(--ink-soft);max-width:none}
.pal-shots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pal-shots img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.dl-row{display:flex;flex-wrap:wrap;gap:10px}
.cmd-box{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--paper)}
.cmd-label{display:block;font-size:.85rem;color:var(--ink-soft);margin-bottom:8px}
.cmd-box pre{margin:0 0 10px;white-space:pre-wrap;word-break:break-all;font-size:.82rem;background:var(--surface);border-radius:8px;padding:10px}
.copy-btn{padding:8px 14px;font-size:.9rem}
.os-ico{width:18px;height:18px;fill:currentColor;flex:none}
.nc .fb{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--signal))}
.nc .fb img{width:56px;height:56px;filter:brightness(0) invert(1);opacity:.9}
@media (prefers-reduced-motion:no-preference){.nc .fb{background-size:200% 200%;animation:fbShift 9s ease infinite}}
@media (max-width:860px){.hero-grid,.contact-grid,.proj{grid-template-columns:1fr;gap:36px}.grid3{grid-template-columns:1fr}.steps{grid-template-columns:1fr;gap:28px}.steps::before{display:none}nav.main a.hide-m{display:none}}
@media (max-width:520px){.wrap{width:calc(100% - 32px)}.hero{padding:64px 0 48px}.lang button{padding:4px 8px}}
</style>
</head>

  <section id="methode">
    <div class="wrap">

    document.documentElement.lang = l;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var v = d[el.getAttribute('data-i18n')]; if (v !== undefined) el.textContent = v;
    });
    document.querySelectorAll('[data-i18n-aria]').forEach(function(el){
      el.setAttribute('aria-label', d[el.getAttribute('data-i18n-aria')]);
    });
    document.querySelectorAll('[data-i18n-meta]').forEach(function(el){
      el.setAttribute('content', d[el.getAttribute('data-i18n-meta')]);
    });
    document.querySelectorAll('.lang button').forEach(function(b){
      b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === l));
    });
    guideTips = d.guide; tip = 0;
    if (typeof renderProjects === 'function') renderProjects(l);
    if (typeof renderStage === 'function') renderStage(l);
    try { localStorage.setItem('intrusion-lang', l); } catch(e) {}
  }
  document.querySelectorAll('.lang button').forEach(function(b){
    b.addEventListener('click', function(){ apply(b.getAttribute('data-lang')); });
  });

  var guideTips = [], tip = 0;
  var guide = document.getElementById('guide'), bubble = document.getElementById('bubble'), pac = document.getElementById('pac');
  function showTip(){
    var t = guideTips[tip % guideTips.length]; tip++;
    bubble.innerHTML = '';
    var a = document.createElement('a'); a.href = T[lang] ? T[lang].guideLink : '#devis'; a.textContent = t;
    bubble.appendChild(a);
    guide.classList.add('open');
  }
  pac.addEventListener('click', function(){ if (guide.classList.contains('open')) { tip++; showTip(); } else { showTip(); } });
  pac.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showTip(); } });
  setTimeout(function(){ guide.classList.add('walk'); }, 0);

  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.documentElement.classList.add('js');
    var io = window.__revealIO = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, { threshold: 0.15 });
    document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });
  } else {
    document.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('in'); });
  }

  /* ==== PROJETS ====
     Pour présenter une nouvelle application, copiez un bloc ci-dessous, puis remplissez-le.
     icon : "med" (santé, ECG) ou "app" (application générique)
     link : adresse de la démo ou du téléchargement, ou null si aucune
  */
  var PROJECTS = [];

  var ICONS = {
    med: '<svg viewBox="0 0 280 150"><path class="f ecg" d="M10 80 H70 L82 60 L94 100 L106 40 L120 96 L132 80 H270" style="stroke-dasharray:260"/><circle class="hl pin" cx="220" cy="48" r="6"/><circle class="hl pin pin2" cx="220" cy="48" r="6" fill="none" stroke="var(--signal)" stroke-width="2"/></svg>',
    app: '<svg viewBox="0 0 280 150"><rect class="s" x="104" y="12" width="72" height="126" rx="12" stroke-width="2"/><rect x="112" y="26" width="56" height="98" rx="6" fill="var(--surface)"/><rect class="lbar" x="120" y="42" width="40" height="6" rx="3"/><rect class="lbar2" x="120" y="42" width="40" height="6" rx="3"/><rect class="lbar" x="120" y="60" width="40" height="6" rx="3"/><rect class="lbar" x="120" y="78" width="28" height="6" rx="3"/></svg>'
  };

  function renderProjects(l){
    var box = document.getElementById('projList');
    if (!box) return;
    box.innerHTML = '';
    var en = (l === 'en');
    PROJECTS.forEach(function(p, i){
      var art = document.createElement('article');
      art.className = 'card reveal ' + (p.icon === 'med' ? 'med' : 'app');
      art.style.setProperty('--d', (i * 120) + 'ms');
      var stage = document.createElement('div');
      stage.className = 'stage';
      stage.setAttribute('aria-hidden', 'true');
      stage.innerHTML = p.image ? '<img src="' + p.image + '" alt="" style="width:88px;height:88px;border-radius:20px">' : (ICONS[p.icon] || ICONS.app);
      var tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = p.tag[l] || p.tag.fr;
      var h = document.createElement('h3'); h.textContent = p.name;
      var d = document.createElement('p'); d.textContent = p.desc[l] || p.desc.fr;
      art.appendChild(stage); art.appendChild(tag); art.appendChild(h); art.appendChild(d);
      if (p.link) {
        var a = document.createElement('a');
        a.className = 'btn ghost'; a.href = p.link; a.rel = 'noopener';
        a.style.marginTop = 'auto';
        a.textContent = en ? 'Open the project' : 'Voir le projet';
        art.appendChild(a);
      }
      box.appendChild(art);
    });
    var soon = document.createElement('article');
    soon.className = 'card soon reveal';
    soon.style.setProperty('--d', (PROJECTS.length * 120) + 'ms');
    soon.innerHTML = '<span class="tag"></span><h3></h3><p></p>';
    soon.querySelector('.tag').textContent = en ? 'Coming soon' : 'Prochainement';
    soon.querySelector('h3').textContent = en ? 'A new project is on its way' : 'Un nouveau projet arrive';
    soon.querySelector('p').textContent = en ? 'We regularly add new applications. Come back or write to us to hear about them first.' : 'Nous ajoutons régulièrement de nouvelles applications. Revenez voir ou écrivez-nous pour être informé en premier.';
    box.appendChild(soon);
    box.querySelectorAll('.reveal').forEach(function(el){
      if (window.__revealIO) window.__revealIO.observe(el); else el.classList.add('in');
    });
  }

  apply(lang);

  document.getElementById('quoteForm').addEventListener('submit', function(e){
    e.preventDefault();
    var f = new FormData(this);
    var subject = (lang === 'en' ? 'Quote request: ' : 'Demande de devis : ') + f.get('service');
    var body = (lang === 'en' ? 'Name: ' : 'Nom : ') + f.get('nom') + '\n' + (lang === 'en' ? 'Phone: ' : 'Téléphone : ') + f.get('tel') + '\n' + (lang === 'en' ? 'Service: ' : 'Service : ') + f.get('service') + '\n\n' + f.get('message');
    window.location.href = 'mailto:ghostkodes@gmail.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  });
})();
</script>
</body>
</html>

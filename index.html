<style>
:root{--paper:#FBF6EE;--surface:#FFFFFF;--ink:#1F1B17;--ink-soft:#5C5249;--line:#E8DCCB;--accent:#B4502A;--accent-ink:#FFFFFF;--signal:#E9A23B;--ease:cubic-bezier(.2,.7,.2,1);color-scheme:light}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:88px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1.0625rem;line-height:1.6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden}

.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.hero{position:relative;padding:96px 0 72px;overflow:hidden}
.hero-grid{position:relative;display:grid;grid-template-columns:1.25fr 1fr;gap:56px;align-items:end}

.domains span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--signal)}
.readout{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;font-size:.95rem}
.readout dt{color:var(--ink-soft);font-size:.85rem;margin-top:14px}

section{padding:72px 0;border-top:1px solid var(--line)}
.intro{max-width:640px;color:var(--ink-soft);margin-bottom:40px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 26px;transition:transform .45s var(--ease),box-shadow .45s var(--ease),border-color .45s}

.card p{color:var(--ink-soft);font-size:.97rem}
.card ul{padding-left:18px;margin:12px 0 0;color:var(--ink-soft);font-size:.95rem}
.card li{margin-bottom:5px}
.stack{font-size:.88rem;color:var(--accent);font-weight:500;margin:-4px 0 14px!important}
.stage{position:relative;height:150px;border-radius:10px;background:var(--paper);border:1px solid var(--line);margin-bottom:22px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.stage svg{width:100%;height:100%}
.stage .f{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.stage .s{fill:none;stroke:var(--line);stroke-width:1.5}
.stage .fill{fill:var(--accent)}
.stage .hl{fill:var(--signal)}
.term{width:100%;height:100%;padding:14px 16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;color:var(--ink-soft);display:flex;flex-direction:column;gap:6px;justify-content:center}
.term .dots{display:flex;gap:5px;margin-bottom:4px}
.term .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.term .ln{white-space:nowrap;overflow:hidden;display:block}
.term .ok{color:var(--accent)}
.term .cmd{display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:bottom}
.caret{display:inline-block;width:7px;height:13px;background:var(--signal);vertical-align:-2px;margin-left:2px}
.mock{width:100%;height:100%;display:grid;grid-template-rows:auto 1fr 1fr;gap:8px;padding:16px 22px;align-content:center}
.mock .blk{background:var(--surface);border:1px solid var(--line);border-radius:6px;transform-origin:left center}
.mock .blk.h{background:var(--accent);border-color:var(--accent);height:14px;width:55%}
.mock .blk.b{min-height:24px}
.mock .blk.a{background:var(--signal);border-color:var(--signal);width:34%;height:22px;justify-self:end}
.steps{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.steps::before{content:"";position:absolute;top:9px;left:9px;right:9px;height:2px;background:var(--line)}
.step{position:relative;padding-top:40px}
.step .dot{position:absolute;top:0;left:0;width:18px;height:18px;border-radius:50%;background:var(--paper);border:2px solid var(--accent)}
.step p{color:var(--ink-soft);font-size:.97rem}
.proj{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:stretch}
.proj .card{display:flex;flex-direction:column}
.lbar{fill:var(--line)}
.lbar2{fill:var(--accent)}
@media (prefers-reduced-motion:no-preference){.lbar2{transform-box:fill-box;transform-origin:0 50%;animation:fillBar 3s ease-in-out infinite}}
@keyframes fillBar{0%,10%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}
.proj .card{display:flex;flex-direction:column}
.proj .tag{display:inline-block;font-size:.8rem;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:999px;padding:3px 10px;margin-bottom:12px;align-self:flex-start}
.proj .soon{border-style:dashed;justify-content:center;align-items:flex-start;color:var(--ink-soft)}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.contact-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px}
.contact-card .row{display:flex;flex-direction:column;gap:4px;padding:16px 0;border-bottom:1px solid var(--line)}
.contact-card .row:last-child{border-bottom:0;padding-bottom:0}
.contact-card .row span{color:var(--ink-soft);font-size:.9rem}
.contact-card .row a{font-size:1.1rem;font-weight:500;color:var(--ink);text-decoration:none;transition:color .25s}
.contact-card .row a:hover{color:var(--accent)}
form.quote{display:grid;gap:14px}
form.quote label{display:grid;gap:6px;font-size:.92rem;color:var(--ink-soft)}
form.quote input,form.quote select,form.quote textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%;transition:border-color .25s,box-shadow .25s}
form.quote input:focus,form.quote select:focus,form.quote textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
form.quote textarea{min-height:120px;resize:vertical}
.note{font-size:.88rem;color:var(--ink-soft);margin-top:6px}
.faq{max-width:820px}
.faq details{border-bottom:1px solid var(--line);padding:18px 0}
.faq details:first-child{border-top:1px solid var(--line)}
.faq summary{cursor:pointer;font-family:"Newsreader",Georgia,serif;font-size:1.25rem;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:"IBM Plex Sans",sans-serif;font-size:1.5rem;color:var(--accent);transition:transform .3s var(--ease)}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{margin:12px 0 0;color:var(--ink-soft)}
footer{border-top:1px solid var(--line);padding:32px 0 calc(110px + env(safe-area-inset-bottom,0px));color:var(--ink-soft);font-size:.9rem}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
/* Guide Pac-Man */
.guide{position:fixed;left:0;bottom:10px;width:44px;height:44px;z-index:20;pointer-events:none}
.guide .pac{pointer-events:auto;cursor:pointer;width:44px;height:44px;display:block}
.guide .bubble{position:absolute;bottom:52px;left:0;width:min(260px,70vw);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.9rem;box-shadow:0 10px 30px -12px rgba(0,0,0,.35);opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s var(--ease);pointer-events:none}
.guide.open .bubble{opacity:1;transform:none;pointer-events:auto}
.guide.open .bubble a{color:var(--accent)}
.track{position:fixed;left:0;right:0;bottom:24px;height:4px;z-index:19;pointer-events:none;background-image:radial-gradient(circle,var(--line) 2px,transparent 2.5px);background-size:22px 4px;background-repeat:repeat-x;opacity:.9}
@media (prefers-reduced-motion:no-preference){
  html.js .reveal{opacity:0;transform:translateY(22px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0ms)}
  html.js .reveal.in{opacity:1;transform:none}
  .hero::before{content:"";position:absolute;inset:-40px;background-image:radial-gradient(circle,color-mix(in srgb,var(--accent) 22%,transparent) 1.2px,transparent 1.6px);background-size:28px 28px;animation:drift 24s linear infinite;mask-image:radial-gradient(ellipse at 70% 40%,#000 0,transparent 65%);pointer-events:none}
  .hero h1,.hero .lead,.hero .threats,.hero .hero-actions,.hero .domains span{animation:rise .9s var(--ease) both}
  .hero h1{animation-delay:.1s}.hero .lead{animation-delay:.25s}.hero .threats{animation-delay:.35s}.hero .hero-actions{animation-delay:.45s}
  .hero .domains span{animation-delay:calc(.6s + var(--i) * 90ms)}
  .hero-grid .readout{animation:rise 1s var(--ease) .5s both}
  .sec .radar{transform-box:view-box;transform-origin:90px 75px;animation:spin 9s linear infinite}
  .sec .shield{stroke-dasharray:320;stroke-dashoffset:320;animation:draw 1.6s var(--ease) .3s forwards}
  .sec .shackle{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .6s var(--ease) 1.7s forwards}
  .sec .lockbody{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .5s var(--ease) 2.1s forwards}
  .sec .attack{animation:attack 4.5s ease-in-out 2.4s infinite;opacity:0}
  .sec .blocked{transform-box:view-box;transform-origin:118px 75px;opacity:0;animation:blockPulse 4.5s ease-out 2.4s infinite}
  .sec .node{opacity:.35;animation:nodeOn 4.5s ease-in-out infinite}
  .sec .node:nth-of-type(2){animation-delay:.6s}.sec .node:nth-of-type(3){animation-delay:1.2s}.sec .node:nth-of-type(4){animation-delay:1.8s}
  .dev .ln{opacity:0;animation:rise .5s var(--ease) forwards}
  .dev .l1{animation-delay:.4s}.dev .l2{animation-delay:1.6s}.dev .l3{animation-delay:2.6s}
  .dev .cmd{width:0;animation:type 1.2s steps(14) .4s forwards}
  .dev .caret{animation:blink 1s steps(1) infinite}
  .dev .blk{transform:scaleY(0);animation:grow .6s var(--ease) forwards}
  .dev .blk.h{animation-delay:.6s}.dev .blk.b{animation-delay:1s}.dev .blk.a{animation-delay:1.4s}
  .dev .mock{animation:loopMock 6s ease-in-out infinite}
  .rep .shackle2{transform-box:view-box;animation:unlock 3.6s var(--ease) infinite}
  .rep .ring{stroke-dasharray:100;stroke-dashoffset:100;animation:ringFill 3.6s var(--ease) infinite}
  .rep .okcheck{stroke-dasharray:30;stroke-dashoffset:30;animation:draw 3.6s var(--ease) infinite}
  .rep .gear{transform-box:view-box;transform-origin:200px 75px;animation:spin 4s linear infinite}
  .med .ecg{stroke-dasharray:260;stroke-dashoffset:260;animation:ecg 3.2s linear infinite}
  .med .pin{transform-box:view-box;transform-origin:center;animation:pinPulse 2.4s ease-out infinite}
  .med .pin2{animation-delay:1.2s}
  .guide.walk{animation:walk 14s linear infinite}
  .guide .mouth{transform-box:fill-box;transform-origin:left center;animation:chomp .5s steps(2) infinite}
  .guide .dotbit{animation:bite 14s steps(1) infinite}
  .track{animation:trackMove 1s linear infinite}
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{to{background-position:280px 280px}}
@keyframes attack{0%{opacity:0;transform:translate(0,0)}10%{opacity:1}60%{opacity:1;transform:translate(-62px,-6px)}70%,100%{opacity:0;transform:translate(-62px,-6px) scale(.2)}}
@keyframes blockPulse{0%,55%{opacity:0;transform:scale(.6)}65%{opacity:.9}100%{opacity:0;transform:scale(2.4)}}
@keyframes nodeOn{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes type{to{width:100%}}
@keyframes blink{50%{opacity:0}}
@keyframes grow{to{transform:scaleY(1)}}
@keyframes loopMock{0%,85%,100%{opacity:1}92%{opacity:.5}}
@keyframes unlock{0%,35%{transform:translateY(0)}55%,100%{transform:translateY(-9px)}}
@keyframes ringFill{0%{stroke-dashoffset:100}55%,100%{stroke-dashoffset:0}}
@keyframes ecg{to{stroke-dashoffset:-260}}
@keyframes pinPulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@keyframes walk{from{transform:translateX(-60px)}to{transform:translateX(calc(100vw + 20px))}}
@keyframes chomp{from{transform:scaleY(1)}to{transform:scaleY(.15)}}
@keyframes bite{from{opacity:1}to{opacity:1}}
@keyframes trackMove{to{background-position:22px 0}}
@media (max-width:860px){.hero-grid,.contact-grid,.proj{grid-template-columns:1fr;gap:36px}.grid3{grid-template-columns:1fr}.steps{grid-template-columns:1fr;gap:28px}.steps::before{display:none}nav.main a.hide-m{display:none}}
@media (max-width:520px){.wrap{width:calc(100% - 32px)}.hero{padding:64px 0 48px}.lang button{padding:4px 8px}}
</style>
